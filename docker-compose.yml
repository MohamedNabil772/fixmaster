services:
  seq:
    image: datalust/seq:latest
    container_name: fixmaster-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:80"
      - "5342:5341"

  postgres:
    image: postgres:latest
    container_name: fixmaster-db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=FixMasterDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  fileserver:
    image: fixmaster-fileserver
    build:
      context: .
      dockerfile: src/Services/FileServer/FixMaster.FileServer.API/Dockerfile
    container_name: fixmaster-fileserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5300:8080"
    volumes:
      - fileserver_data:/app/uploads

volumes:
  postgres_data:
  fileserver_data:
